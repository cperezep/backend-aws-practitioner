openapi: "3.0.1"
info:
  title: "Products Service"
  description: "Products REST API backed by AWS Lambda and DynamoDB"
  version: "2026-04-23"
servers:
- url: "https://44hcac7j89.execute-api.us-east-1.amazonaws.com/{basePath}"
  variables:
    basePath:
      default: "prod"
paths:
  /products:
    get:
      summary: "List all products"
      description: "Returns all products with their current stock counts."
      operationId: "getProducts"
      responses:
        "200":
          description: "Successful response"
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: "string"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ProductWithStock"
    post:
      summary: "Create a product"
      description: "Creates a new product and an associated stock record atomically."
      operationId: "createProduct"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductInput"
      responses:
        "201":
          description: "Product created"
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductWithStock"
        "400":
          description: "Invalid request body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    options:
      responses:
        "204":
          description: "CORS preflight"
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: "string"
            Access-Control-Allow-Methods:
              schema:
                type: "string"
            Access-Control-Allow-Headers:
              schema:
                type: "string"
          content: {}
  /import:
    get:
      operationId: getImportUploadUrl
      summary: Issue a pre-signed S3 PUT URL for a CSV upload
      description: |
        Returns a short-lived (300 s) pre-signed S3 PUT URL that the client
        uses to upload the named CSV file directly to the import bucket
        under the key `uploaded/{name}`. The browser MUST send the upload
        with header `Content-Type: text/csv`.

        **Authentication required.** Pass your credentials as a Basic Auth header:
        `Authorization: Basic base64(username:password)`
      security:
        - basicAuth: []
      tags: [Import]
      parameters:
        - name: name
          in: query
          required: true
          description: Basename of the CSV file (no path separators).
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[A-Za-z0-9._-]+\.csv$'
            example: products.csv
      responses:
        "200":
          description: Pre-signed URL successfully generated.
          content:
            application/json:
              schema:
                type: string
                format: uri
        "400":
          description: Invalid or missing `name`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value: { message: 'name is required' }
                notCsv:
                  value: { message: 'name must end with .csv' }
                invalidChars:
                  value: { message: 'name contains invalid characters' }
        "401":
          description: Authorization header is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value: { message: 'Unauthorized' }
        "403":
          description: Credentials are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                denied:
                  value: { message: 'User is not authorized to access this resource with an explicit deny' }
        "500":
          description: Internal error generating the signed URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /products/{productId}:
    get:
      summary: "Get a product by ID"
      description: "Returns a single product with its stock count."
      operationId: "getProduct"
      parameters:
      - name: "productId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Successful response"
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductWithStock"
        "400":
          description: "Missing productId path parameter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Product not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    options:
      parameters:
      - name: "productId"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "204":
          description: "CORS preflight"
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: "string"
            Access-Control-Allow-Methods:
              schema:
                type: "string"
            Access-Control-Allow-Headers:
              schema:
                type: "string"
          content: {}
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >
        Base64-encoded `username:password`. The username must match an entry
        in the authorizer Lambda's environment variables.
  schemas:
    Product:
      type: "object"
      required:
        - id
        - title
        - price
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "Server-assigned unique identifier"
        title:
          type: "string"
          minLength: 1
          description: "Product name"
        description:
          type: "string"
          description: "Optional product description"
        price:
          type: "number"
          minimum: 0
          description: "Product price (>= 0)"
    ProductWithStock:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: "object"
          required:
            - count
          properties:
            count:
              type: "integer"
              minimum: 0
              description: "Number of units currently in stock"
    CreateProductInput:
      type: "object"
      required:
        - title
        - price
        - count
      properties:
        title:
          type: "string"
          minLength: 1
        description:
          type: "string"
        price:
          type: "number"
          minimum: 0
        count:
          type: "integer"
          minimum: 0
          default: 0
          description: "Initial stock count (defaults to 0)"
    ErrorResponse:
      type: "object"
      properties:
        message:
          type: "string"
x-amazon-apigateway-security-policy: "TLS_1_0"
